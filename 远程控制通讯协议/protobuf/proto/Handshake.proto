syntax = "proto2";

package AEC.RemoteControl.Message;
option java_package = "com.maudio.aec.rcs.message";
option java_outer_classname = "Handshake";
//option csharp_namespace = "AEC.RemoteControl.Message";

message HandshakeRequest{

  enum ClientType {
    RemoteClient = 0;       //远程客户端
    LocalClient = 1;        //本地客户端
    Administrator = 2;      //管理员
  }

  required uint32 version = 1;                //版本
  required ClientType client_type = 2;        //客户端类型
  optional uint32 signature_code = 3;         //机器特征码
  optional string user_name = 4;              //管理员用户名
  optional string password_hash = 5;          //密码hash
}

message HandshakeResponse{
  enum StatusCode{
    Unknown = 0;
    Successful = 1;                   //成功
	  VersionTooLow = 2;                //客户端版本太低
    ClientTypeError = 3;              //客户端类型错误
    SignatureCodeError = 4;           //机器码错误
    ServerError = 5;                  //服务器出错
    ClientError = 6;                  //客户端出错
    UserNameOrPasswordError = 7;     //用户名或密码错误
  }

  required StatusCode status = 1; //状态码
  optional uint32 client_id = 2;  //客户端id
  optional string ip_address = 3; //IP地址
}